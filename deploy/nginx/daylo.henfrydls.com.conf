# nginx site for daylo.henfrydls.com. Static files only; certbot adds the TLS block.
server {
    listen 80;
    listen [::]:80;
    server_name daylo.henfrydls.com;

    root /var/www/daylo;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # The demo is a single-page app: unknown paths under /demo/ load its index.
    location /demo/ {
        try_files $uri $uri/ /demo/index.html;
    }

    # Hashed bundle names: cache for a year.
    location ~ ^/(demo/)?assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
