# nginx site for daylo.henfrydls.com. Static files only.
# Same shape as the other sites on this server: TLS from the wildcard certificate
# for *.henfrydls.com that certbot already renews, plus a plain-HTTP redirect.

# Cache policy by path. This file is included in the http context, so a map may live here.
# First match wins: hashed bundles must be tested before the extension rule (a hashed .svg is immutable).
# HTML and everything else: "no-cache" = store, but revalidate before use (nginx answers 304 via ETag),
# so a publish is visible at once.
map $uri $cache_ctl {
    default                                               "no-cache";
    ~^/demo/assets/                                       "public, max-age=31536000, immutable";
    ~*\.(png|jpe?g|gif|ico|svg|webp|woff2?|webmanifest)$  "public, max-age=3600";
}

server {
    server_name daylo.henfrydls.com;

    root /var/www/daylo;
    index index.html;
    charset utf-8;

    # Declared once at server level and inherited by every location below, which is only true
    # because no location declares an add_header of its own.
    # HSTS starts at one day and without includeSubDomains: the wildcard covers sites this file does not control.
    add_header Cache-Control $cache_ctl always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    # Text assets travel compressed; the global nginx.conf only covers HTML.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    gzip_vary on;   # shared caches must not hand a compressed body to a client that did not ask for one

    location / {
        try_files $uri $uri/ =404;
    }

    # Kept reachable on purpose (ACME HTTP-01 lives here if this site ever needs its own certificate).
    # ^~ beats the dotfile regex below regardless of where this block sits in the file.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # The demo is a single-page app: unknown paths under /demo/ load its index.
    location /demo/ {
        try_files $uri $uri/ /demo/index.html;
    }

    # Hashed bundles and other static files: served as-is (404 if missing, never the index), quietly.
    location ~ ^/demo/assets/ {
        access_log off;
    }
    location ~* \.(png|jpe?g|gif|ico|svg|webp|woff2?|webmanifest)$ {
        access_log off;
    }

    # Any other dotfile or dot-directory stays hidden.
    location ~ /\. {
        deny all;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/henfrydls.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/henfrydls.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name daylo.henfrydls.com;
    return 301 https://$host$request_uri;
}
