# nginx site for daylo.henfrydls.com. Static files only.
# Same shape as the other sites on this server: TLS from the wildcard certificate
# for *.henfrydls.com that certbot already renews, plus a plain-HTTP redirect.
server {
    server_name daylo.henfrydls.com;

    root /var/www/daylo;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # The demo is a single-page app: unknown paths under /demo/ load its index.
    location /demo/ {
        try_files $uri $uri/ /demo/index.html;
    }

    # Hashed bundle names: safe to cache for good.
    location ~ ^/demo/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Everything else keeps its name and does change (screenshots, social image, icons): cache briefly, revalidate.
    location ~* \.(png|jpe?g|gif|ico|svg|webp|woff2?|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/henfrydls.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/henfrydls.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name daylo.henfrydls.com;
    return 301 https://$host$request_uri;
}
